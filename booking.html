<div class="bk"><div class="wrap in">
  <div>

    <!-- S1  venue: court picker -->
    <section class="screen" id="s1">
      <h1 data-str="bk.s1_h"></h1>
      <p class="sub" data-str="bk.s1_sub"></p>
      <div class="opts" id="courtList"></div>
    </section>

    <!-- S1c  class: category pre-select (BACKEND CHANGE REQUEST) -->
    <section class="screen" id="s1c">
      <h1 data-str="bk.s1c_h"></h1>
      <p class="sub" data-str="bk.s1c_sub"></p>
      <div class="cr"><b data-str="bk.cr_l"></b><span data-str="bk.cr_cat"></span></div>
      <div class="opts" id="catList"></div>
    </section>

    <!-- S5  pt: coach picker (BACKEND CHANGE REQUEST) -->
    <section class="screen" id="s5">
      <h1 data-str="bk.s5_h"></h1>
      <p class="sub" data-str="bk.s5_sub"></p>
      <div class="cr"><b data-str="bk.cr_l"></b><span data-str="bk.cr_coach"></span></div>
      <div class="opts" id="coachList"></div>
    </section>

    <!-- S5b  pt: group size -->
    <section class="screen" id="s5b">
      <h1 data-str="bk.s5b_h"></h1>
      <p class="sub" data-str="bk.s5b_sub"></p>
      <div class="opts two" id="sizeList"></div>
    </section>

    <!-- S3  class: session list -->
    <section class="screen" id="s3">
      <h1 data-str="bk.s3_h"></h1>
      <p class="sub" id="s3sub"></p>
      <div class="chips" id="classChips"></div>
      <div class="dates" id="dates3"></div>
      <div class="opts" id="classList"></div>
    </section>

    <!-- S2  venue + pt: date and time -->
    <section class="screen" id="s2">
      <h1 data-str="bk.s2_h"></h1>
      <p class="sub" id="s2sub"></p>
      <div class="dates" id="dates2"></div>
      <div class="slotgrid" id="slots"></div>
      <p class="meta" style="margin-top:14px" data-str="bk.s2_note"></p>
    </section>

    <!-- S6  contact -->
    <section class="screen" id="s6">
      <h1 data-str="bk.s6_h"></h1>
      <p class="sub" data-str="bk.s6_sub"></p>
      <div class="form">
        <div class="row2">
          <div><label class="fl" for="fFirst" data-str="bk.f_first"></label><input type="text" id="fFirst" autocomplete="given-name"></div>
          <div><label class="fl" for="fLast" data-str="bk.f_last"></label><input type="text" id="fLast" autocomplete="family-name"></div>
        </div>
        <div><label class="fl" for="fEmail" data-str="bk.f_email"></label><input type="email" id="fEmail" placeholder="you@email.com" autocomplete="email"></div>
        <div><label class="fl" for="fPhone" data-str="bk.f_phone"></label><input type="tel" id="fPhone" placeholder="(852) 0000 0000" autocomplete="tel"></div>
        <div><label class="fl" for="fNotes" data-str="bk.f_notes"></label><textarea id="fNotes" data-str-ph="bk.f_notes_ph"></textarea></div>
        <label class="check"><input type="checkbox" id="cWaiver"><span data-str="bk.c_waiv"></span></label>
        <label class="check"><input type="checkbox" id="cMkt"><span data-str="bk.c_mkt"></span></label>
        <p class="warn" id="fWarn" data-str="bk.s6_warn"></p>
      </div>
    </section>

    <!-- S7  confirm -->
    <section class="screen" id="s7">
      <h1 data-str="bk.s7_h"></h1>
      <p class="sub" data-str="bk.s7_sub"></p>
      <div id="s7lines"></div>
      <div class="cr" style="margin-top:18px"><b data-str="bk.cr_l"></b><span data-str="bk.cr_pay"></span></div>
    </section>

    <!-- S8  success -->
    <section class="screen" id="s8">
      <div class="done-mark"><svg viewBox="0 0 24 24"><path d="M4 12.5 L9.5 18 L20 6.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h1 data-str="bk.s8_h"></h1>
      <p class="sub" data-str="bk.s8_sub"></p>
      <div class="recap" id="recap"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn btn-primary" href="index.html" data-str="bk.s8_home"></a>
        <a class="btn btn-ghost" href="booking.html" data-str="bk.s8_again"></a>
      </div>
    </section>

  </div>

  <!-- desktop summary -->
  <aside class="summary" id="summary" hidden>
    <h3 data-str="bk.sum_h"></h3>
    <p class="venue">Sporting Hub Hong Kong</p>
    <div id="sumLines"></div>
    <div class="total"><span data-str="bk.sum_total"></span><span id="sumTotal" class="price-tbc">HK$ TBC</span></div>
    <button class="btn btn-primary" id="sumNext" data-str="bk.next"></button>
    <p class="policy" data-str="bk.policy"></p>
  </aside>
</div></div>
